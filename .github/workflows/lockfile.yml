name: Generate lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Switch CI to frozen lockfile + cache
        run: |
          sed -i 's|      # TODO: add `cache: pnpm` and use --frozen-lockfile once pnpm-lock.yaml is committed|          cache: pnpm|' .github/workflows/ci.yml
          sed -i 's|pnpm install --no-frozen-lockfile|pnpm install --frozen-lockfile|' .github/workflows/ci.yml
          cat .github/workflows/ci.yml
      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/lockfile
          git add pnpm-lock.yaml .github/workflows/ci.yml
          git commit -m "chore: add pnpm-lock.yaml and use frozen lockfile in CI"
          git push -f origin chore/lockfile
          gh pr create --base main --head chore/lockfile --title "chore: add pnpm-lock.yaml" --body "Generated by the lockfile workflow. Adds pnpm-lock.yaml and switches CI to --frozen-lockfile with pnpm cache." || echo "PR may already exist"
