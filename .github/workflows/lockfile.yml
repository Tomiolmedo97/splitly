name: Generate lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Add dependencies
        run: |
          pnpm --filter @splitly/web add framer-motion lucide-react clsx tailwind-merge
          pnpm add -w -D @playwright/test @axe-core/playwright
      # GITHUB_TOKEN cannot modify .github/workflows; ci.yml changes are pushed separately.
      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/lockfile
          git add pnpm-lock.yaml package.json apps/web/package.json
          git commit -m "chore: add deps and pnpm-lock.yaml"
          git push -f origin chore/lockfile
