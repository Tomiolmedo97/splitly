name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma validate + generate
        # Placeholders: no hay base en CI; validate/generate no se conectan.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/splitly
          DIRECT_URL: postgresql://ci:ci@localhost:5432/splitly
        run: |
          pnpm --filter @splitly/web db:validate
          pnpm --filter @splitly/web db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
